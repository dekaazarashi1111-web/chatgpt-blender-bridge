name: Creative workspace

on:
  push:
    branches: [main]
    paths: ['projects/*/jobs/*/job.json', 'projects/*/reviews/*.json']
  workflow_dispatch:
    inputs:
      job_path:
        description: 'Optional projects/<project>/jobs/<job>/job.json; empty processes pending jobs'
        required: false
        default: ''
  workflow_run:
    workflows: ['Build creative runtime']
    types: [completed]
    branches: [main]

permissions:
  contents: write
  packages: read
  actions: read

concurrency:
  group: creative-workspace-main
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      has_jobs: ${{ steps.select.outputs.has_jobs }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply pinned image reviews
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ci/review_workspace.py
      - id: select
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_JOB: ${{ inputs.job_path }}
        run: python3 ci/select_creative_jobs.py --job "$REQUESTED_JOB"

  create:
    needs: prepare
    if: needs.prepare.outputs.has_jobs == 'true'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch the verified tool environment and pin this run's digest
        id: runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/chatgpt-creative-runtime"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if ! docker pull "$image:runtime-v2"; then
            echo 'Runtime is not published yet. Build creative runtime, then this workflow will retry pending jobs.'
            exit 1
          fi
          digest=$(docker image inspect "$image:runtime-v2" --format '{{index .RepoDigests 0}}')
          echo "image=$digest" >> "$GITHUB_OUTPUT"
          docker logout ghcr.io
      - name: Execute tools and publish durable checkpoints
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_PATH: ${{ matrix.job }}
          RUNTIME_IMAGE: ${{ steps.runtime.outputs.image }}
        run: python3 ci/run_creative_job.py --job "$JOB_PATH" --image "$RUNTIME_IMAGE"
      - name: Read back exact Release manifest evidence
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_PATH: ${{ matrix.job }}
        run: python3 ci/readback_creative_evidence.py --job "$JOB_PATH"
      - name: Summarize compact continuation evidence
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path('.creative-runs').glob('*/work/output/**/continuation_report.json')):
              report = json.loads(path.read_text())
              summary = {key: value for key, value in report.items() if key != 'previews'}
              print('CONTINUATION_EVIDENCE ' + str(path))
              print(json.dumps(summary, indent=2, ensure_ascii=False))
          PY
      - name: Preserve host logs even on failure
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: creative-host-${{ matrix.project }}-${{ strategy.job-index }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .creative-runs/*/host/*.log
            .creative-runs/*/host/result.json
            .creative-runs/*/host/evidence/
          include-hidden-files: true
          retention-days: 30
      - name: Preserve lightweight visual evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: creative-visual-${{ matrix.project }}-${{ strategy.job-index }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .creative-runs/*/work/output/**/*.png
            .creative-runs/*/work/output/**/*.jpg
            .creative-runs/*/work/output/**/*.jpeg
            .creative-runs/*/work/output/**/*.webp
            .creative-runs/*/work/output/**/*.json
            .creative-runs/*/work/output/**/*.py
            .creative-runs/*/work/output/**/*.md
            .creative-runs/*/work/output/**/*.txt
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve editable outputs and previews for review download
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: creative-review-${{ matrix.project }}-${{ strategy.job-index }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .creative-runs/*/work/output/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
