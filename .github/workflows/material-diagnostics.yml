name: Material Maker startup diagnostics
on:
  push:
    branches: [main]
    paths: ['.github/workflows/material-diagnostics.yml']
permissions:
  contents: read
jobs:
  probe:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install display and debugger
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb xauth mesa-vulkan-drivers libvulkan1 gdb
      - name: Trace official binary startup
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, urllib.request, tarfile
          lock = {'url': 'https://github.com/RodZill4/material-maker/releases/download/1.6/material_maker_1_6_linux.tar.gz', 'sha256': 'c4673a964ef39b4a705bcafb55b5214ac2f966c995aef3efe5636a4036883c1e'}
          path = pathlib.Path('/tmp/mm-diagnostic.tar.gz')
          urllib.request.urlretrieve(lock['url'], path)
          assert hashlib.sha256(path.read_bytes()).hexdigest() == lock['sha256']
          with tarfile.open(path) as archive:
              archive.extractall('/tmp/mm-diagnostic', filter='data')
          PY
          mkdir -p /tmp/mm-diagnostic-output
          timeout 90s xvfb-run -a gdb --batch -ex 'set pagination off' -ex run -ex 'bt 15' --args /tmp/mm-diagnostic/material_maker_1_6_linux/material_maker.x86_64 --verbose --audio-driver Dummy --accessibility disabled --export-material --target Blender -o /tmp/mm-diagnostic-output --output-file test "$PWD/runtime/fixtures/material/terracotta.ptex"
