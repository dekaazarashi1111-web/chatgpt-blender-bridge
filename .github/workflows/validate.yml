name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install jsonschema==4.23.0
      - run: python -m unittest discover -s tests -v
      - run: python bridge_cli.py validate
      - run: python ci/select_creative_jobs.py --validate-only
      - run: python -m compileall -q bridge ci runtime
